[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "asr-tasks"
version = "0.1.0"
description = "Asynchronous long-form transcription service powered by FunASR"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "numpy==1.26.4",
  "pydantic-settings==2.10.1",
  "pypinyin==0.55.0",
  "python-multipart==0.0.20",
  "rapidfuzz==3.14.1",
  "soundfile==0.13.1",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
]

[project.scripts]
asr-tasks = "asr_tasks.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asr_tasks"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["model: optional test that downloads and runs real FunASR models"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/asr_tasks/api.py" = ["B008"]

[tool.coverage.run]
source = ["asr_tasks"]

[tool.coverage.report]
show_missing = true
skip_covered = true
